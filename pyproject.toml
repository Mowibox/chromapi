[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromapi"
version = "0.1.0"
authors = [{ name = "Mowibox", email = "ousmane.thiongane@outlook.com" }]
description = "High-level software for the Chromapi 12-DOF quadruped robot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.5",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.13.0.92",
    "opencv-contrib-python-headless>=4.13.0.92",
    "waitress>=3.0.2",
    "flask>=3.1.3",

]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4",
]
rl = [
    "mujoco>=3.0",
    "gymnasium>=0.29",
    "onnxruntime>=1.16",
]
all = [
    "chromapi[audio]",
    "chromapi[rl]",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-requests",
    "types-toml",
]

[project.scripts]
chromapi-diagnostics = "chromapi.utils.hardware_diagnostic:main"
chromapi-scan-motors = "chromapi.utils.scan_motors:main"
chromapi-setup-motors = "chromapi.utils.setup_motors:main"
chromapi-cam-calib = "chromapi.utils.calibrate_camera:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chromapi = ["**/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
pythonpath = "src"
markers = [
    "hardware: requires physical hardware (RPi + peripherals). Never runs in CI.",
]

[tool.ruff]
exclude = [
    "src/chromapi/__init__.py",
    "build/*",
    ".venv/",
    "tests/conftest.py",
    "tests/*"
]

[tool.ruff.lint]
select = ["I", "D"]
ignore = [
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"src/chromapi/utils/*.py" = ["D"]
"src/chromapi/hardware/test.py" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src/"]
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
disable_error_code = ["attr-defined"]