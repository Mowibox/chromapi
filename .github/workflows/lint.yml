name: Linters

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "pyproject.toml"

permissions:
  contents: read

# Annule automatiquement les workflows en cours si un nouveau push arrive sur la même PR/branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Action ultra-rapide écrite en Rust, n'installe même pas Python
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.5.0" # À ajuster selon la version de votre pyproject.toml

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libportaudio2
          version: 1.0
          
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the project
        # --frozen garantit que uv.lock est respecté à la lettre
        run: uv sync --frozen --all-extras --group dev

      - name: Lint with mypy
        run: uv run mypy