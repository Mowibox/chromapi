# Chromapi audio - installed as /etc/asound.conf.
#
# Card: the googlevoicehat-soundcard overlay (speaker + ICS-43434 microphone, 48 kHz, S32_LE).
# Check its name with: cat /proc/asound/cards

pcm.!default {
    type asym
    playback.pcm "chromapi_speaker"
    capture.pcm "chromapi_mic"
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}

# Any rate/format a program asks for, converted into the shared mixer.
pcm.chromapi_speaker {
    type plug
    slave.pcm "chromapi_mixer"
}

pcm.chromapi_mixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666           # shared by root (the keep-alive) and the user's programs
    slave {
        pcm "hw:sndrpigooglevoi,0"
        rate 48000
        format S32_LE
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.chromapi_mic {
    type plug
    slave.pcm "hw:sndrpigooglevoi,0"
}
